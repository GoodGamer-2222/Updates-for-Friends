<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recent Updates</title>
<style>
:root{--bg:#f7f4ef;--card:#fff;--text:#2a2622;--muted:#8a8279;--line:#e8e3dc;--accent:#d9622b;--accent-text:#fff;--shadow:0 2px 14px rgba(60,40,20,.08)}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#161412;--card:#221f1c;--text:#f0ebe4;--muted:#9a9189;--line:#38342f;--accent:#e8794a;--accent-text:#1a1008;--shadow:0 2px 14px rgba(0,0,0,.4)}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 Georgia,"Times New Roman",serif}
main{max-width:640px;margin:0 auto;padding:36px 16px 60px}
header{text-align:center;margin-bottom:22px}
h1{font-size:2.3rem;margin:0 0 4px;letter-spacing:-.02em;line-height:1.15}
.sub{color:var(--muted);margin:0;font-style:italic}
button{font:600 .9rem system-ui,sans-serif;border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:var(--accent-text);cursor:pointer}
.bar{display:flex;justify-content:center;margin-bottom:18px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{background:none;color:var(--muted);padding:6px 18px;border-radius:999px}
.seg button.on{background:var(--accent);color:var(--accent-text)}
.post{background:var(--card);border-radius:16px;overflow:hidden;margin-bottom:24px;box-shadow:var(--shadow)}
.post>img,.post>video{display:block;width:100%;max-height:82vh;object-fit:contain;background:#000}
.post>img{cursor:zoom-in}
.embed{aspect-ratio:16/9;background:#000}.embed iframe{width:100%;height:100%;border:0}
.cap{padding:14px 18px 16px}.cap p{margin:0 0 8px;white-space:pre-wrap}
.meta{color:var(--muted);font:.8rem system-ui,sans-serif}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tile{display:block;width:100%;aspect-ratio:1;padding:0;border-radius:6px;background:#222;position:relative;overflow:hidden}
.tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile .play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:1.8rem;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.empty{text-align:center;color:var(--muted);padding:60px 0;font-style:italic}
#lb{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
#lbc{max-width:96vw;max-height:76vh;display:flex}
#lbc img,#lbc video{max-width:96vw;max-height:76vh;object-fit:contain}
#lbc iframe{width:min(96vw,900px);aspect-ratio:16/9;border:0}
#lbcap{color:#eee;max-width:620px;text-align:center;margin-top:14px;white-space:pre-wrap}
#lbcap small{display:block;color:#999;font:.8rem system-ui,sans-serif;margin-top:4px}
#lb button{position:absolute;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;width:44px;height:44px;padding:0;font-size:1.3rem}
#lbx{top:14px;right:14px}#lbp{left:12px;top:50%}#lbn{right:12px;top:50%}
</style>
</head>
<body>
<main>
  <header><h1 id="title">Recent Updates</h1><p class="sub" id="subtitle"></p></header>
  <div class="bar"><div class="seg"><button data-v="feed">Feed</button><button data-v="grid">Grid</button></div></div>
  <div id="feed"><div class="empty">Loading…</div></div>
</main>
<div id="lb" hidden>
  <button id="lbx" aria-label="Close">✕</button><button id="lbp" aria-label="Previous">‹</button><button id="lbn" aria-label="Next">›</button>
  <div id="lbc"></div><div id="lbcap"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = d => { const t = new Date(d+'T12:00:00'); return isNaN(t) ? '' : t.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); };
let data = {title:'Recent Updates', subtitle:'', posts:[]}, view = 'feed', lb = -1;

fetch('posts.json?t=' + Date.now()).then(r => { if(!r.ok) throw 0; return r.json(); })
  .then(d => { data = d; data.posts = data.posts || []; render(); })
  .catch(() => { $('#feed').innerHTML = '<div class="empty">Couldn’t load the posts. This page needs to be opened from its hosted address.</div>'; });

function feedItem(p,i){
  let m;
  if(p.type==='video') m = `<video src="${esc(p.src)}" controls playsinline preload="metadata"></video>`;
  else if(p.type==='embed') m = `<div class="embed"><iframe src="${esc(p.src)}" allowfullscreen loading="lazy"></iframe></div>`;
  else m = `<img src="${esc(p.src)}" alt="${esc(p.caption||'photo')}" loading="lazy" data-open="${i}">`;
  return `<article class="post">${m}<div class="cap">${p.caption?`<p>${esc(p.caption)}</p>`:''}<div class="meta">${esc(fmt(p.d))}</div></div></article>`;
}
function gridItem(p,i){
  const inner = p.type==='image' ? `<img src="${esc(p.src)}" alt="" loading="lazy">`
    : p.type==='video' ? `<video src="${esc(p.src)}#t=0.1" preload="metadata" muted></video><span class="play">▶</span>` : `<span class="play">▶</span>`;
  return `<button class="tile" data-open="${i}" aria-label="Open">${inner}</button>`;
}
function render(){
  $('#title').textContent = data.title || 'Recent Updates';
  document.title = data.title || 'Recent Updates';
  $('#subtitle').textContent = data.subtitle || ''; $('#subtitle').hidden = !data.subtitle;
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.v===view));
  $('#feed').innerHTML = !data.posts.length ? '<div class="empty">Nothing posted yet. Check back soon!</div>'
    : view==='grid' ? `<div class="grid">${data.posts.map(gridItem).join('')}</div>` : data.posts.map(feedItem).join('');
}
$('#feed').addEventListener('click', e => { const t = e.target.closest('[data-open]'); if(t) openLb(+t.dataset.open); });
document.querySelector('.seg').onclick = e => { const b = e.target.closest('button'); if(b){ view = b.dataset.v; render(); } };

function openLb(i){ lb = i; showLb(); $('#lb').hidden = false; }
function closeLb(){ $('#lb').hidden = true; $('#lbc').innerHTML = ''; }
function showLb(){
  const p = data.posts[lb]; if(!p) return closeLb();
  $('#lbc').innerHTML = p.type==='video' ? `<video src="${esc(p.src)}" controls autoplay playsinline></video>`
    : p.type==='embed' ? `<iframe src="${esc(p.src)}" allowfullscreen></iframe>` : `<img src="${esc(p.src)}" alt="">`;
  $('#lbcap').innerHTML = esc(p.caption||'') + `<small>${esc(fmt(p.d))}</small>`;
  $('#lbp').hidden = lb<=0; $('#lbn').hidden = lb>=data.posts.length-1;
}
const step = d => { const n = lb+d; if(n>=0 && n<data.posts.length){ lb = n; showLb(); } };
$('#lbx').onclick = closeLb; $('#lbp').onclick = () => step(-1); $('#lbn').onclick = () => step(1);
$('#lb').addEventListener('click', e => { if(e.target.id==='lb' || e.target.id==='lbc') closeLb(); });
document.addEventListener('keydown', e => { if($('#lb').hidden) return; if(e.key==='Escape') closeLb(); if(e.key==='ArrowLeft') step(-1); if(e.key==='ArrowRight') step(1); });
let tx = null;
$('#lb').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, {passive:true});
$('#lb').addEventListener('touchend', e => { if(tx===null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if(Math.abs(dx)>60) step(dx<0?1:-1); });
</script>
</body>
</html>
