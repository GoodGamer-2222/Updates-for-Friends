<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recent Updates</title>
<style>
:root{--bg:#f7f4ef;--card:#fff;--text:#2a2622;--muted:#8a8279;--line:#e8e3dc;--accent:#d9622b;--accent-text:#fff;--shadow:0 2px 14px rgba(60,40,20,.08)}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#161412;--card:#221f1c;--text:#f0ebe4;--muted:#9a9189;--line:#38342f;--accent:#e8794a;--accent-text:#1a1008;--shadow:0 2px 14px rgba(0,0,0,.4)}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 Georgia,"Times New Roman",serif}
main{max-width:640px;margin:0 auto;padding:36px 16px 60px}
header{text-align:center;margin-bottom:22px}
h1{font-size:2.3rem;margin:0 0 4px;letter-spacing:-.02em;line-height:1.15}
.sub{color:var(--muted);margin:0;font:1rem Georgia,serif;font-style:italic}
button{font:600 .9rem system-ui,sans-serif;border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:var(--accent-text);cursor:pointer}
button.ghost{background:none;color:var(--muted);padding:0;font-weight:500}
button.sec{background:var(--bg);color:var(--text);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
.bar{display:flex;justify-content:center;margin-bottom:18px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{background:none;color:var(--muted);padding:6px 18px;border-radius:999px}
.seg button.on{background:var(--accent);color:var(--accent-text)}
.post{background:var(--card);border-radius:16px;overflow:hidden;margin-bottom:24px;box-shadow:var(--shadow)}
.post>img,.post>video{display:block;width:100%;max-height:82vh;object-fit:contain;background:#000}
.post>img{cursor:zoom-in}
.embed{aspect-ratio:16/9;background:#000}.embed iframe{width:100%;height:100%;border:0}
.cap{padding:14px 18px 16px}
.cap p{margin:0 0 8px;white-space:pre-wrap}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font:.8rem system-ui,sans-serif}
.meta .t button{font-size:.8rem;margin-left:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tilew{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:#000}
.tile{display:block;width:100%;height:100%;padding:0;border-radius:0;background:#222;position:relative}
.tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile .play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:1.8rem;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.tools{position:absolute;top:5px;right:5px;display:flex;gap:5px}
.tools button{padding:5px 8px;background:rgba(0,0,0,.65);color:#fff;font-size:.75rem}
.add{background:var(--card);border:1px dashed var(--accent);border-radius:16px;padding:16px;margin-bottom:24px;font-family:system-ui,sans-serif}
.add h2{margin:14px 0 8px;font-size:.95rem}.add h2:first-child{margin-top:0}
.add input[type=text],.add input[type=date],.add textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;margin-bottom:8px}
.drop{display:block;text-align:center;padding:22px 10px;border:2px dashed var(--line);border-radius:12px;color:var(--muted);cursor:pointer;margin-bottom:10px}
.drop.over{border-color:var(--accent);color:var(--accent)}
.pi{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start}
.pi .th{width:72px;height:72px;border-radius:8px;object-fit:cover;background:var(--bg);flex:none;display:grid;place-items:center;overflow:hidden;font-size:1.4rem}
.pi .th img,.pi .th video{width:100%;height:100%;object-fit:cover}
.pi .f{flex:1;min-width:0}.pi .f input{margin-bottom:6px}
.row{display:flex;gap:8px;margin-top:6px}.row input{margin:0!important}
#msg,#size{font:.8rem system-ui,sans-serif;color:var(--muted);margin-top:10px}
.dirty{position:sticky;top:8px;z-index:5;background:var(--accent);color:var(--accent-text);border-radius:12px;padding:12px 14px;margin-bottom:18px;font:.9rem system-ui,sans-serif;display:flex;gap:12px;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
.dirty button{background:var(--accent-text);color:var(--accent);flex:none}
.empty{text-align:center;color:var(--muted);padding:60px 0;font-style:italic}
footer{text-align:center;margin-top:34px}footer button{font-size:.8rem}
#lb{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
#lbc{max-width:96vw;max-height:76vh;display:flex}
#lbc img,#lbc video{max-width:96vw;max-height:76vh;object-fit:contain}
#lbc iframe{width:min(96vw,900px);aspect-ratio:16/9;border:0}
#lbcap{color:#eee;max-width:620px;text-align:center;margin-top:14px;white-space:pre-wrap}
#lbcap small{display:block;color:#999;font:.8rem system-ui,sans-serif;margin-top:4px}
#lb button{position:absolute;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;width:44px;height:44px;padding:0;font-size:1.3rem}
#lbx{top:14px;right:14px}#lbp{left:12px;top:50%}#lbn{right:12px;top:50%}
</style>
</head>
<body>
<main>
  <header><h1 id="title"></h1><p class="sub" id="subtitle"></p></header>
  <div id="dirty"></div>
  <div id="adder"></div>
  <div class="bar"><div class="seg"><button data-v="feed">Feed</button><button data-v="grid">Grid</button></div></div>
  <div id="feed"></div>
  <footer><button class="ghost" id="toggle"></button></footer>
</main>
<div id="lb" hidden>
  <button id="lbx" aria-label="Close">✕</button><button id="lbp" aria-label="Previous">‹</button><button id="lbn" aria-label="Next">›</button>
  <div id="lbc"></div><div id="lbcap"></div>
</div>
<script type="application/json" id="data">{"title":"Recent Updates","subtitle":"Photos and videos, newest first","posts":[]}</script>
<script>
const pristine = '<!DOCTYPE html>' + document.documentElement.outerHTML;
let state = {title:'Recent Updates', subtitle:'', posts:[]};
try { state = JSON.parse(document.getElementById('data').textContent); } catch(e){}
let editing=false, dirty=false, saved=false, view='feed', pending=[], lbIndex=-1;

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = () => new Date().toISOString().slice(0,10);
const fmt = d => { const t = new Date(d+'T12:00:00'); return isNaN(t) ? '' : t.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); };
const label = p => p.d ? fmt(p.d) : (p.date||'');

function build(){
  const json = JSON.stringify(state).replace(/</g,'\\u003c');
  return pristine.replace(/(<script type="application\/json" id="data">)[\s\S]*?(<\/script>)/, (m,a,b)=>a+json+b);
}
function download(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([build()], {type:'text/html'})); a.download = 'index.html';
  document.body.appendChild(a); a.click(); a.remove();
  dirty = false; saved = true; render();
}
window.addEventListener('beforeunload', e => { if(dirty){ e.preventDefault(); e.returnValue=''; } });
function changed(){ dirty = true; saved = false; render(); updateSize(); }

/* ---------- feed ---------- */
function tools(p, grid){
  if(!editing) return '';
  const b = `<button class="ghost" data-edit="${esc(p.id)}">Edit caption</button><button class="ghost" data-del="${esc(p.id)}">Delete</button>`;
  return grid ? `<div class="tools"><button data-edit="${esc(p.id)}">✎</button><button data-del="${esc(p.id)}">✕</button></div>` : `<span class="t">${b}</span>`;
}
function feedItem(p,i){
  let media;
  if(p.type==='video') media = `<video src="${esc(p.src)}" controls playsinline preload="metadata"></video>`;
  else if(p.type==='embed') media = `<div class="embed"><iframe src="${esc(p.src)}" allowfullscreen loading="lazy"></iframe></div>`;
  else media = `<img src="${esc(p.src)}" alt="${esc(p.caption||'photo')}" loading="lazy" data-open="${i}">`;
  return `<article class="post">${media}<div class="cap">${p.caption?`<p>${esc(p.caption)}</p>`:''}<div class="meta"><span>${esc(label(p))}</span>${tools(p,false)}</div></div></article>`;
}
function gridItem(p,i){
  let inner;
  if(p.type==='image') inner = `<img src="${esc(p.src)}" alt="" loading="lazy">`;
  else if(p.type==='video') inner = `<video src="${esc(p.src)}#t=0.1" preload="metadata" muted></video><span class="play">▶</span>`;
  else inner = `<span class="play">▶</span>`;
  return `<div class="tilew"><button class="tile" data-open="${i}" aria-label="Open">${inner}</button>${tools(p,true)}</div>`;
}
function render(){
  $('#title').textContent = state.title || 'Recent Updates';
  $('#subtitle').textContent = state.subtitle || ''; $('#subtitle').hidden = !state.subtitle;
  document.title = state.title || 'Recent Updates';
  $('#dirty').innerHTML = dirty ? '<div class="dirty"><span>You have unsaved changes. Download the updated page, then upload it to your host.</span><button id="dl">Download</button></div>'
    : saved ? '<div class="dirty"><span>Downloaded! Now upload that index.html to your host to publish it.</span></div>' : '';
  if(dirty) $('#dl').onclick = download;
  $('#toggle').textContent = editing ? 'Close editor' : 'Owner: add posts';
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.v===view));
  const f = $('#feed');
  if(!state.posts.length){ f.innerHTML = `<div class="empty">${editing?'Nothing yet. Add your first photo or video above.':'Nothing posted yet. Check back soon!'}</div>`; return; }
  f.innerHTML = view==='grid' ? `<div class="grid">${state.posts.map(gridItem).join('')}</div>` : state.posts.map(feedItem).join('');
}
$('#feed').addEventListener('click', e => {
  const t = e.target.closest('[data-open],[data-edit],[data-del]'); if(!t) return;
  if(t.dataset.open!==undefined) return openLb(+t.dataset.open);
  const p = state.posts.find(x => x.id === (t.dataset.edit||t.dataset.del)); if(!p) return;
  if(t.dataset.edit){ const c = prompt('Edit caption', p.caption||''); if(c!==null){ p.caption = c.trim(); changed(); } }
  else if(confirm('Delete this post?')){ state.posts = state.posts.filter(x => x!==p); changed(); }
});
document.querySelector('.seg').onclick = e => { const b = e.target.closest('button'); if(b){ view = b.dataset.v; render(); } };

/* ---------- lightbox ---------- */
function openLb(i){ lbIndex = i; showLb(); $('#lb').hidden = false; }
function closeLb(){ $('#lb').hidden = true; $('#lbc').innerHTML = ''; }
function showLb(){
  const p = state.posts[lbIndex]; if(!p) return closeLb();
  $('#lbc').innerHTML = p.type==='video' ? `<video src="${esc(p.src)}" controls autoplay playsinline></video>`
    : p.type==='embed' ? `<iframe src="${esc(p.src)}" allowfullscreen></iframe>` : `<img src="${esc(p.src)}" alt="">`;
  $('#lbcap').innerHTML = esc(p.caption||'') + `<small>${esc(label(p))}</small>`;
  $('#lbp').hidden = lbIndex<=0; $('#lbn').hidden = lbIndex>=state.posts.length-1;
}
const step = d => { const n = lbIndex+d; if(n>=0 && n<state.posts.length){ lbIndex = n; showLb(); } };
$('#lbx').onclick = closeLb; $('#lbp').onclick = () => step(-1); $('#lbn').onclick = () => step(1);
$('#lb').addEventListener('click', e => { if(e.target.id==='lb' || e.target.id==='lbc') closeLb(); });
document.addEventListener('keydown', e => { if($('#lb').hidden) return; if(e.key==='Escape') closeLb(); if(e.key==='ArrowLeft') step(-1); if(e.key==='ArrowRight') step(1); });
let tx = null;
$('#lb').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, {passive:true});
$('#lb').addEventListener('touchend', e => { if(tx===null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if(Math.abs(dx)>60) step(dx<0?1:-1); });

/* ---------- editor ---------- */
function parseLink(u){
  u = u.trim(); let m;
  if(m = u.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{11})/)) return {type:'embed', src:'https://www.youtube.com/embed/'+m[1]};
  if(m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/)) return {type:'embed', src:'https://player.vimeo.com/video/'+m[1]};
  if(/^https?:\/\/.+\.(mp4|webm|mov)(\?.*)?$/i.test(u)) return {type:'video', src:u};
  if(/^https?:\/\/.+\.(jpe?g|png|gif|webp)(\?.*)?$/i.test(u)) return {type:'image', src:u};
  return null;
}
const readAsDataURL = f => new Promise((res,rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
const shrinkImage = f => new Promise((res,rej) => {
  const img = new Image();
  img.onload = () => {
    const s = Math.min(1, 1600/Math.max(img.width,img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.82));
  };
  img.onerror = rej; img.src = URL.createObjectURL(f);
});
function updateSize(){
  const el = $('#size'); if(!el) return;
  const mb = JSON.stringify(state).length/1048576;
  el.textContent = `Page size: ${mb.toFixed(1)} MB` + (mb>20 ? ' (getting big; the page will load slowly and some hosts have size limits)' : '');
}
function renderPending(){
  const box = $('#pend'); if(!box) return;
  box.innerHTML = pending.map((p,i) => `<div class="pi"><div class="th">${p.file ? (p.type==='video' ? `<video src="${p.prev}"></video>` : `<img src="${p.prev}" alt="">`) : '🔗'}</div>
    <div class="f"><input type="text" data-c="${i}" placeholder="Caption…" value="${esc(p.caption)}"><input type="date" data-d="${i}" value="${esc(p.d)}"></div>
    <button class="ghost" data-x="${i}" aria-label="Remove">✕</button></div>`).join('')
    + (pending.length ? `<button id="addall">Add ${pending.length} to page</button><span id="msg"></span>` : '');
  box.oninput = e => { const t = e.target; if(t.dataset.c!==undefined) pending[+t.dataset.c].caption = t.value; if(t.dataset.d!==undefined) pending[+t.dataset.d].d = t.value; };
  box.onclick = e => { const x = e.target.closest('[data-x]'); if(x){ pending.splice(+x.dataset.x,1); renderPending(); } };
  if(pending.length) $('#addall').onclick = addAll;
}
function addFiles(files){
  for(const f of files){
    if(!/^(image|video)\//.test(f.type)) continue;
    pending.push({file:f, type:f.type.startsWith('video')?'video':'image', caption:'', d:new Date(f.lastModified||Date.now()).toISOString().slice(0,10), prev:URL.createObjectURL(f)});
  }
  renderPending();
}
async function addAll(){
  const btn = $('#addall'), msg = $('#msg'); btn.disabled = true; msg.textContent = ' Processing…';
  try {
    const made = [];
    for(const p of pending){
      let src = p.src;
      if(p.file){
        if(p.type==='video' && p.file.size>15*1048576 && !confirm('“'+p.file.name+'” is a large video and will slow your page down. Add it anyway?')) continue;
        src = p.type==='video' ? await readAsDataURL(p.file) : await shrinkImage(p.file);
      }
      made.push({id:'p'+Date.now()+Math.random().toString(36).slice(2,6), src, type:p.type, caption:p.caption.trim(), d:p.d||today()});
    }
    state.posts = made.concat(state.posts); pending = []; renderPending(); changed();
  } catch(e){ msg.textContent = ' Couldn’t read one of the files. Try JPG, PNG or MP4.'; btn.disabled = false; }
}
function renderAdder(){
  const box = $('#adder');
  if(!editing){ box.innerHTML = ''; return; }
  box.innerHTML = `<div class="add"><h2>Page details</h2>
    <input type="text" id="ttl" placeholder="Page title" value="${esc(state.title)}">
    <input type="text" id="sub" placeholder="Subtitle (optional)" value="${esc(state.subtitle)}">
    <h2>Add photos &amp; videos</h2>
    <label class="drop" id="drop">Tap to choose files, or drop them here<input type="file" id="file" multiple accept="image/*,video/*" hidden></label>
    <div id="pend"></div>
    <h2>Or add a link</h2>
    <div class="row"><input type="text" id="link" placeholder="YouTube, Vimeo, or image/video URL"><button class="sec" id="addlink">Add</button></div>
    <div id="size"></div></div>`;
  $('#ttl').oninput = e => { state.title = e.target.value; dirty = true; saved = false; render(); };
  $('#sub').oninput = e => { state.subtitle = e.target.value; dirty = true; saved = false; render(); };
  $('#file').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
  const drop = $('#drop');
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); addFiles(e.dataTransfer.files); };
  $('#addlink').onclick = () => {
    const r = parseLink($('#link').value);
    if(!r){ alert('That link isn’t recognized. Try a YouTube or Vimeo link, or a direct link ending in .mp4 or .jpg.'); return; }
    pending.push({...r, caption:'', d:today()}); $('#link').value = ''; renderPending();
  };
  renderPending(); updateSize();
}
$('#toggle').onclick = () => { editing = !editing; renderAdder(); render(); };
render();
</script>
</body>
</html>
